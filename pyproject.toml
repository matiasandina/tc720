[project]
name = "tc720"
version = "0.1.0"
description = "Python interface for TE Technology TC-720 controller"
readme = "README.md"
authors = [
    { name = "Matias Andina", email = "matiasandina@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "contourpy==1.3.1",
    "cycler==0.12.1",
    "docutils==0.21.2",
    "fonttools==4.55.0",
    "furo>=2024.8.6",
    "importlib-metadata==8.5.0",
    "keyboard==0.13.5",
    "kiwisolver==1.4.7",
    "libusb==1.0.27.post3",
    "markdown-it-py==3.0.0",
    "matplotlib==3.9.2",
    "mdurl==0.1.2",
    "numpy==2.1.3",
    "packaging==24.2",
    "pandas==2.2.3",
    "pillow==11.0.0",
    "pkg-about==1.2.5",
    "pygments==2.18.0",
    "pyparsing==3.2.0",
    "pyserial==3.5",
    "python-dateutil==2.9.0.post0",
    "pytz==2024.2",
    "pyyaml==6.0.2",
    "rich==13.9.4",
    "setuptools==75.5.0",
    "six==1.16.0",
    "sphinx>=8.1.3",
    "tzdata==2024.2",
    "wheel==0.44.0",
    "zipp==3.21.0",
]

[project.scripts]
tc720 = "tc720.main:main"
tc720-test-ramp = "tc720.test_ramp:cli_entry"
tc720-test-program-sequence = "tc720.test_program_sequence:cli_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
