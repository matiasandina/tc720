# .readthedocs.yml
version: 2
build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  jobs:
    pre_build:
      - pip install uv
    post_build:
      - uv pip install -r docs/requirements.txt
    build:
      - sphinx-build -b html docs/source docs/build/html

sphinx:
  configuration: docs/source/conf.py
python:
  install:
    - method: editable
      path: .
